# Group: LUMORA_CLOUD
spring:
  datasource:
    url: "jdbc:mysql://${LUMORA_MYSQL_HOST:192.168.100.132}:${LUMORA_MYSQL_PORT:3307}/${LUMORA_MODEL_CATALOG_DATABASE:lumora_model_catalog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: ${LUMORA_MYSQL_USERNAME:lumora}
    password: ${LUMORA_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

lumora:
  catalog:
    cache-ttl: PT5M

logging:
  level:
    com.lumora.cloud.catalog: info
