# Group: LUMORA_CLOUD
spring:
  datasource:
    url: "jdbc:mysql://${LUMORA_MYSQL_HOST:192.168.100.132}:${LUMORA_MYSQL_PORT:3307}/${LUMORA_USER_DATABASE:lumora_user}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: ${LUMORA_MYSQL_USERNAME:lumora}
    password: ${LUMORA_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

lumora:
  auth:
    jwt:
      access-token-ttl: PT15M
    refresh-token-ttl: P30D
    cookie:
      name: lumora_refresh
      secure: ${LUMORA_COOKIE_SECURE:false}
      same-site: Strict
      path: /api/app/auth

logging:
  level:
    com.lumora.cloud.user: info
