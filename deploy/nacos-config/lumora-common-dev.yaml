# Group: LUMORA_CLOUD
# Shared development configuration. Secrets remain in backend/.env and are
# resolved from environment variables when each application starts.
spring:
  data:
    redis:
      host: ${LUMORA_REDIS_HOST:192.168.100.132}
      port: ${LUMORA_REDIS_PORT:6379}
      password: ${LUMORA_REDIS_PASSWORD}
      timeout: 3000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  rabbitmq:
    host: ${LUMORA_RABBITMQ_HOST:192.168.100.132}
    port: ${LUMORA_RABBITMQ_PORT:5672}
    virtual-host: ${LUMORA_RABBITMQ_VHOST:/lumora}
    username: ${LUMORA_RABBITMQ_USERNAME:lumora}
    password: ${LUMORA_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
        multiplier: 2
        max-interval: 3000ms
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 1
        max-concurrency: 3
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
  cloud:
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${LUMORA_SENTINEL_DASHBOARD:192.168.100.132:8858}
      datasource:
        flow-rules:
          nacos:
            server-addr: ${LUMORA_NACOS_ADDR:192.168.100.132:8848}
            username: ${LUMORA_NACOS_USERNAME:nacos}
            password: ${LUMORA_NACOS_PASSWORD}
            group-id: LUMORA_CLOUD
            data-id: ${spring.application.name}-sentinel-flow-dev.json
            data-type: json
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: ${LUMORA_NACOS_ADDR:192.168.100.132:8848}
            username: ${LUMORA_NACOS_USERNAME:nacos}
            password: ${LUMORA_NACOS_PASSWORD}
            group-id: LUMORA_CLOUD
            data-id: ${spring.application.name}-sentinel-degrade-dev.json
            data-type: json
            rule-type: degrade

feign:
  sentinel:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

lumora:
  auth:
    jwt:
      issuer: lumora-cloud
      audience: lumora-cloud-api
