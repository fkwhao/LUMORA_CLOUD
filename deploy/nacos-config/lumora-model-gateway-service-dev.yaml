# Group: LUMORA_CLOUD
spring:
  codec:
    max-in-memory-size: 8MB
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 8000

lumora:
  model-gateway:
    catalog:
      local-cache-ttl: PT30S
      maximum-size: 1000
    concurrency:
      per-user: 3
      # 0 表示不额外设置逻辑模型总并发；容量主要由账号和路由配置决定。
      per-model: 0
      lease-ttl: PT5M
      request-lease-ttl: PT10M
    provider:
      connect-timeout: PT5S
      response-timeout: PT2M
      max-call-duration: PT3M
      max-connections: 200
      pending-acquire-max-count: 1000
      pending-acquire-timeout: PT3S
      max-idle-time: PT2M
      max-error-body-bytes: 1048576
      max-buffered-response-bytes: 16777216
    recovery:
      retention: P7D
      scan-interval: PT10S
      batch-size: 100
    route-protection:
      failure-ratio: 0.5
      minimum-calls: 10
      statistical-window-seconds: 30
      open-duration-seconds: 10
    diagnostics:
      summary-window: PT24H
      summary-bucket: PT5M
      bucket-retention: PT26H
      recent-retention: PT24H
      recent-limit: 100

logging:
  level:
    com.lumora.cloud.modelgateway: info
