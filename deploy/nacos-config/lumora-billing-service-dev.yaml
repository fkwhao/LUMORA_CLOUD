# Group: LUMORA_CLOUD
spring:
  datasource:
    url: "jdbc:mysql://${LUMORA_MYSQL_HOST:192.168.100.132}:${LUMORA_MYSQL_PORT:3307}/${LUMORA_BILLING_DATABASE:lumora_billing}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: ${LUMORA_MYSQL_USERNAME:lumora}
    password: ${LUMORA_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.lumora.cloud.billing: info

lumora:
  billing:
    plan-cache-ttl: PT5M
    payment:
      mock-enabled: true
      order-ttl: PT30M
      subscription-duration: P30D
      expiry-scan-interval: PT1M
      expiry-initial-delay: PT1M
    reservation-expiry:
      enabled: true
      scan-interval: PT1M
      initial-delay: PT1M
      batch-size: 100
