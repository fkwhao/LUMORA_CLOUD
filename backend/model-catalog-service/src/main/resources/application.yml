spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    default: dev
  application:
    name: lumora-model-catalog-service
  cloud:
    nacos:
      discovery:
        server-addr: ${LUMORA_NACOS_ADDR:127.0.0.1:8848}

server:
  port: ${LUMORA_CATALOG_PORT:46103}

management:
  endpoints:
    web:
      exposure:
        include: health,info

lumora:
  security:
    internal-token: ${LUMORA_INTERNAL_TOKEN}
  catalog:
    credentials:
      master-key: ${LUMORA_CREDENTIAL_MASTER_KEY}
      key-version: ${LUMORA_CREDENTIAL_KEY_VERSION:1}
