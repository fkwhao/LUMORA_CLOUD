spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    default: dev
  application:
    name: lumora-model-gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${LUMORA_NACOS_ADDR:127.0.0.1:8848}

server:
  port: ${LUMORA_MODEL_GATEWAY_PORT:46104}

management:
  endpoints:
    web:
      exposure:
        include: health,info,sentinel

lumora:
  model-gateway:
    recovery:
      journal-directory: ${LUMORA_RECOVERY_JOURNAL_DIR:./data/billing-recovery}
      journal-max-entries: ${LUMORA_RECOVERY_JOURNAL_MAX_ENTRIES:100000}
      max-attempts: ${LUMORA_RECOVERY_MAX_ATTEMPTS:1000}
  security:
    internal-token: ${LUMORA_INTERNAL_TOKEN}
