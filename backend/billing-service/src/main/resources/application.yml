spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    default: dev
  application:
    name: lumora-billing-service
  cloud:
    nacos:
      discovery:
        server-addr: ${LUMORA_NACOS_ADDR:127.0.0.1:8848}

server:
  port: ${LUMORA_BILLING_PORT:46102}

management:
  endpoints:
    web:
      exposure:
        include: health,info

lumora:
  security:
    internal-token: ${LUMORA_INTERNAL_TOKEN}
